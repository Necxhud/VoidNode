name: Build VoidNode APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > voidnode-release.jks
          test -s voidnode-release.jks

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload VoidNode APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidNode-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
