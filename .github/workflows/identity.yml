name: identity-tests
on:
  push:
    paths: ['identity/**', 'build.gradle.kts', 'settings.gradle.kts', '.github/workflows/identity.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - name: Test
        run: ./gradlew :identity:test --configure-on-demand --console=plain
